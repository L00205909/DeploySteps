
name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Get repository files
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build

      - name: Build container image
        run: docker build --tag deploysteps:${{ github.sha }} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deploysteps:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      # AWS deployment - main branch only
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: DeploySteps-${{ github.run_id }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          : "${ECR_REPOSITORY_URI:?ECR_REPOSITORY_URI is not configured}"
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          docker tag deploysteps:${{ github.sha }} \
            "$ECR_REPOSITORY_URI:${{ github.sha }}"

          docker push "$ECR_REPOSITORY_URI:${{ github.sha }}"

      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          : "${EC2_INSTANCE_ID:?EC2_INSTANCE_ID is not configured}"
          : "${ECR_REPOSITORY_URI:?ECR_REPOSITORY_URI is not configured}"

          DEPLOY_COMMAND="set -Eeuo pipefail
          cd /opt/deploysteps
          git fetch --depth 1 origin '${GITHUB_SHA}'
          git checkout --force --detach '${GITHUB_SHA}'
          WEB_IMAGE='${ECR_REPOSITORY_URI}:${GITHUB_SHA}' bash deploy/deploy.sh"

          PARAMETERS=$(jq -n --arg command "$DEPLOY_COMMAND" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "DeploySteps deployment ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
