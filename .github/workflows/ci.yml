name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build
